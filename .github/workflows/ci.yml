name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (Lambda + CDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Unit tests (Lambda)
        run: npx vitest run tests/unit/lambda/

      # The stack bundles dist/frontend as an asset, so synthesising it — which
      # every CDK test does — needs the bundle to exist.
      - name: Build frontend
        run: node scripts/build-frontend.js

      - name: CDK tests
        run: npx vitest run tests/cdk/

  frontend-tests:
    name: Frontend (Components + Hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Type-check frontend
        run: npm run lint:frontend

      - name: Frontend unit tests
        run: npx vitest run tests/unit/frontend/ tests/unit/lambda/helpers/

      - name: Build frontend
        run: node scripts/build-frontend.js

  quality:
    name: Quality (coverage, audit, synth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      # The stack bundles dist/frontend as an asset: both the CDK tests inside
      # the coverage run and the synth below need the bundle to exist.
      - name: Build frontend
        run: node scripts/build-frontend.js

      - name: Coverage thresholds
        run: npm run test:coverage

      - name: CDK synth
        run: npx cdk synth --quiet
